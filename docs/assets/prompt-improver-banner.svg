<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Prompt Improver</title>
  <desc id="desc">Уточнить цель, собрать контекст и подготовить задание. Пользователь выбирает глубину брифинга.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".04"/></pattern>
  </defs>
  <rect width="1280" height="400" rx="20" fill="#112D32"/>
  <rect width="1280" height="400" rx="20" fill="url(#grid)"/>
  <path d="M58 57h24v24H58zM89 57h24v24H89zM58 88h24v24H58z" fill="#B9E7CE"/>
  <path d="M89 88h24v24H89z" fill="#F1C48C"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="134" y="79" fill="#B9E7CE" font-size="17" font-weight="600" letter-spacing="2">PROMPT IMPROVER</text>
    <text x="134" y="105" fill="#A7BCBE" font-size="16">Идея → брифинг → готовое задание</text>
    <text x="58" y="191" fill="#F5F5EB" font-size="49" font-weight="650">Уточнить задачу.</text>
    <text x="58" y="251" fill="#F5F5EB" font-size="49" font-weight="650">Сохранить смысл.</text>
    <text x="60" y="315" fill="#B5CBCD" font-size="21">Глубину вопросов выбираете вы.</text>
    <rect x="745" y="68" width="462" height="74" rx="12" fill="#1B3C41" stroke="#3B5A5E"/>
    <text x="768" y="111" fill="#A9BFBE" font-size="17">01</text><text x="816" y="113" fill="#F5F5EB" font-size="23">Понять цель</text>
    <path d="M976 143v25" stroke="#71918E" stroke-width="2"/>
    <rect x="745" y="168" width="462" height="74" rx="12" fill="#1B3C41" stroke="#3B5A5E"/>
    <text x="768" y="211" fill="#A9BFBE" font-size="17">02</text><text x="816" y="213" fill="#F5F5EB" font-size="23">Проверить контекст</text>
    <path d="M976 243v25" stroke="#71918E" stroke-width="2"/>
    <rect x="745" y="268" width="462" height="74" rx="12" fill="#B9E7CE"/>
    <text x="768" y="311" fill="#264B40" font-size="17">03</text><text x="816" y="313" fill="#173A32" font-size="23" font-weight="600">Собрать промпт</text>
  </g>
</svg>
